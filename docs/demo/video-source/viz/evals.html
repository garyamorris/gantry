<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gantry: the eval gate</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="fh.css">
<style>
  #hdr { position: absolute; left: 21px; right: 21px; top: 8px; height: 38px; display: flex; align-items: center; gap: 16px; }
  #hdr h1 { font-size: 24px; font-weight: 760; letter-spacing: -0.01em; white-space: nowrap; }
  #hdr h1 span { color: var(--accent); }
  #hdr .sub { color: var(--text-3); font-size: 17px; }
  .sec { position: absolute; opacity: 0; }
  .sec h2 { font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 650; margin-bottom: 10px; }
  .row { position: relative; height: 58px; display: grid; grid-template-columns: 330px 1fr 140px; gap: 14px; align-items: center; opacity: 0; }
  .row .nm { font-size: 18px; font-weight: 600; line-height: 22px; } .row .nm small { display: block; font-size: 15px; color: var(--text-3); font-weight: 500; }
  .track { position: relative; height: 24px; border-radius: 12px; background: var(--surface-3); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 12px; width: 0; }
  .floor { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--text); border-radius: 2px; }
  .floor::after { content: 'floor'; position: absolute; top: 32px; left: -14px; font-size: 13px; color: var(--text-3); letter-spacing: .04em; }
  .val { font: 700 22px/24px var(--mono); text-align: right; white-space: nowrap; }
  .val small { font-size: 15px; color: var(--text-3); font-weight: 500; }
  .pass { color: var(--ok); }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 18px; }
  .card .k { font-size: 15px; color: var(--text-3); text-transform: uppercase; letter-spacing: .07em; font-weight: 650; }
  .card .n { font: 750 46px/52px var(--mono); }
  .card .d { color: var(--text-2); font-size: 16px; line-height: 21px; }
</style>
</head>
<body>
  <div id="hdr"><h1>Gantry: <span>the eval gate</span></h1><div class="sub">hidden ground truth, three whole matches, no network</div></div>
  <div id="stage"></div>
  <script type="module" src="evals.js"></script>
</body>
</html>
