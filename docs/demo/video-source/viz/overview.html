<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gantry: the loop</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="fh.css">
<style>
  :root { --feed: #4fd1c5; --chat: #f6a560; --flow1: #8aa0ff; --flow2: #cf8ae8; --mem: #7bd88a; --out: #f2c14e; }
  #hdr { position: absolute; left: 21px; right: 21px; top: 8px; height: 38px; display: flex; align-items: center; gap: 16px; }
  #hdr h1 { font-size: 24px; font-weight: 760; letter-spacing: -0.01em; white-space: nowrap; }
  #hdr h1 span { color: var(--accent); }
  #hdr .sub { color: var(--text-3); font-size: 17px; }
  .box { position: absolute; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface); opacity: 0; }
  .box .t { position: absolute; left: 14px; top: 9px; font: 700 18px/22px var(--mono); letter-spacing: -0.02em; white-space: nowrap; }
  .box .s { position: absolute; left: 14px; top: 34px; right: 12px; font-size: 15px; line-height: 19px; color: var(--text-3); }
  .tag { position: absolute; right: 12px; top: 10px; font-size: 14px; font-weight: 650; padding: 1px 9px; border-radius: 11px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); white-space: nowrap; }
  .tick { position: absolute; left: 12px; right: 12px; font-size: 15px; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; }
  .tick b { font-family: var(--mono); font-weight: 650; margin-right: 8px; }
  .chip { position: absolute; font: 650 15px/24px var(--mono); padding: 0 9px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-2); white-space: nowrap; opacity: 0; }
  .chip.on { color: var(--text); border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--surface-2)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 22%, transparent); }
  .out { position: absolute; border-radius: 12px; border: 1.5px solid var(--border-strong); background: var(--surface-2); padding: 7px 11px; font-size: 15px; line-height: 19px; opacity: 0; }
  .out b { display: block; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--c); margin-bottom: 1px; }
  .stamp { position: absolute; right: 8px; top: 7px; font-size: 13px; font-weight: 700; letter-spacing: .04em; padding: 0 7px; border-radius: 9px; }
  .stamp.pub { color: var(--ok); background: var(--ok-soft); } .stamp.ask { color: var(--medium); background: var(--medium-soft); } .stamp.hold { color: var(--text-3); background: var(--surface-3); }
  .big { position: absolute; font: 650 16px/20px var(--mono); color: var(--text-2); opacity: 0; white-space: nowrap; }
  svg#wires { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; }
  svg#wires path { fill: none; stroke-width: 2.4; stroke-linecap: round; }
  .bar { position: absolute; height: 12px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 6px; background: var(--c); width: 0; }
</style>
</head>
<body>
  <div id="hdr"><h1>Gantry: <span>the loop</span></h1><div class="sub">a feed and a chat in, polls and pins out, a memory in between</div></div>
  <svg id="wires"></svg>
  <div id="stage"></div>
  <script type="module" src="overview.js"></script>
</body>
</html>
